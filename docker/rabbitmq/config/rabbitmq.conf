# =============================================================================
# RabbitMQ Configuration - Оптимальные настройки для разработки
# Документация: https://www.rabbitmq.com/configure.html
# =============================================================================

# -----------------------------------------------------------------------------
# Сеть и подключения
# -----------------------------------------------------------------------------
# Слушать на всех интерфейсах
listeners.tcp.default = 5672

# Максимальное количество подключений (0 = без лимита)
# Для production рекомендуется установить разумный лимит
# connection_max = 1000

# Heartbeat интервал (секунды) - для обнаружения "мертвых" соединений
heartbeat = 60

# -----------------------------------------------------------------------------
# Память и производительность
# -----------------------------------------------------------------------------
# Порог памяти (% от доступной RAM)
vm_memory_high_watermark.relative = 0.6

# Абсолютный лимит памяти (альтернатива относительному)
# vm_memory_high_watermark.absolute = 1GB

# Стратегия при достижении лимита памяти
vm_memory_high_watermark_paging_ratio = 0.75

# Минимальное свободное место на диске
disk_free_limit.absolute = 1GB

# -----------------------------------------------------------------------------
# Очереди и сообщения
# -----------------------------------------------------------------------------
# Максимальный размер сообщения (байты)
max_message_size = 134217728

# Prefetch count по умолчанию (количество сообщений на consumer)
# Оптимально для большинства случаев
consumer_timeout = 1800000

# -----------------------------------------------------------------------------
# Management Plugin
# -----------------------------------------------------------------------------
# Порт для Management UI
management.tcp.port = 15672

# Статистика (интервал сбора в мс)
collect_statistics_interval = 5000

# Retention политики для статистики
management.rates_mode = basic

# -----------------------------------------------------------------------------
# Prometheus Metrics
# -----------------------------------------------------------------------------
# Enable Prometheus metrics endpoint on port 15692
prometheus.return_per_object_metrics = true
prometheus.tcp.port = 15692

# -----------------------------------------------------------------------------
# Логирование
# -----------------------------------------------------------------------------
log.console = true
log.console.level = info

# Логирование в файл
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info

# Ротация логов
log.file.rotation.date = $D0
log.file.rotation.size = 10485760
log.file.rotation.count = 5

# -----------------------------------------------------------------------------
# Кластеризация (для production)
# -----------------------------------------------------------------------------
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
# cluster_partition_handling = autoheal

# -----------------------------------------------------------------------------
# Безопасность (для production раскомментировать)
# -----------------------------------------------------------------------------
# Отключить гостевой доступ извне (только localhost)
loopback_users.guest = false

# SSL/TLS (для production)
# ssl_options.cacertfile = /path/to/ca_certificate.pem
# ssl_options.certfile = /path/to/server_certificate.pem
# ssl_options.keyfile = /path/to/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true

