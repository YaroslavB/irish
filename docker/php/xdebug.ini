zend_extension = xdebug.so

[Xdebug]
; Документация: https://xdebug.org/docs/all_settings

; ============================================================================
; РЕЖИМ РАБОТЫ (раскомментируйте нужный)
; ============================================================================
; off          - Xdebug полностью отключен (максимальная производительность)
; develop      - Улучшенные сообщения об ошибках, var_dump()
; debug        - Пошаговая отладка в IDE
; profile      - Профилирование (создает cachegrind файлы)
; coverage     - Покрытие кода для PHPUnit
; trace        - Трассировка вызовов функций
; ============================================================================

; Для разработки (отладка + улучшенный вывод):
;xdebug.mode=develop,debug

; Для тестирования с покрытием:
;xdebug.mode=coverage

; Для профилирования:
;xdebug.mode=profile

; Отключено (для production или когда отладка не нужна):
xdebug.mode=off

; ============================================================================
; ПОДКЛЮЧЕНИЕ К IDE
; ============================================================================
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=PHPSTORM

; Когда начинать отладку:
; yes     - всегда (может замедлять)
; trigger - только с XDEBUG_TRIGGER cookie/GET/POST (рекомендуется)
; no      - никогда
xdebug.start_with_request=trigger

; Таймаут подключения к IDE (мс)
xdebug.connect_timeout_ms=200

; ============================================================================
; ОТОБРАЖЕНИЕ И ЛОГИРОВАНИЕ
; ============================================================================
xdebug.cli_color=1
xdebug.var_display_max_depth=5
xdebug.var_display_max_children=256
xdebug.var_display_max_data=1024

; Максимальная глубина вложенности (защита от бесконечной рекурсии)
xdebug.max_nesting_level=512

; Логирование (раскомментируйте для диагностики проблем)
;xdebug.log=/var/log/php/xdebug.log
;xdebug.log_level=3

; ============================================================================
; ПРОФИЛИРОВАНИЕ (когда xdebug.mode=profile)
; ============================================================================
xdebug.output_dir=/tmp/xdebug
xdebug.profiler_output_name=cachegrind.out.%p.%t

; Профилировать только по триггеру (XDEBUG_PROFILE cookie/GET)
xdebug.profiler_append=0
