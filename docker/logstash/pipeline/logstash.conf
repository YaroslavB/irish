input {
  tcp {
    port => 5044
    codec => json_lines
  }

  # Read logs from file
  file {
    path => "/var/log/symfony/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^\["
      negate => true
      what => "previous"
    }
  }
}

filter {
  if [message] =~ /^\[/ {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{DATA:channel}\.%{DATA:level}: %{GREEDYDATA:log_message}" }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ssZ" ]
      target => "@timestamp"
    }
  }

  # Parse JSON logs from Monolog
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  mutate {
    add_field => { "application" => "irish" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "symfony-logs-%{+YYYY.MM.dd}"
  }

  # Debug output to console
  stdout {
    codec => rubydebug
  }
}

