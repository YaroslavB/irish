build:
    environment:
        php:
            version: 8.2

    nodes:
        analysis:
            tests:
                override:
                    - php-scrutinizer-run

    dependencies:
        before:
            - composer install --no-interaction --prefer-dist

filter:
    excluded_paths:
        - 'tests/*'
        - 'vendor/*'
        - 'var/*'
        - 'config/*'
        - 'migrations/*'
        - 'public/*'
        - 'docker/*'
        - 'bin/*'

checks:
    php:
        code_rating: true
        duplication: true
        remove_extra_empty_lines: true
        remove_php_closing_tag: true
        remove_trailing_whitespace: true
        fix_use_statements:
            remove_unused: true
            preserve_multiple: false
            preserve_blanklines: true
            order_alphabetically: true
        fix_php_opening_tag: true
        fix_linefeed: true
        fix_line_ending: true
        fix_identation_4spaces: true
        fix_doc_comments: true

tools:
    external_code_coverage: false
    php_code_sniffer:
        enabled: true
        config:
            standard: PSR12
    php_cs_fixer:
        enabled: true
        config:
            level: symfony
    php_mess_detector:
        enabled: true
        config:
            ruleset: phpmd.xml
            design_rules: { eval_expression: false }
    php_pdepend: true
    php_analyzer: true
    sensiolabs_security_checker: true

