# SonarCloud Configuration
sonar.projectKey=YaroslavB_irish
sonar.organization=yaroslavb
sonar.projectName=irish
sonar.host.url=https://sonarcloud.io

# Source directories
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# PHP settings
sonar.php.version=8.1

# Exclusions (not analyzed at all)
sonar.exclusions=vendor/**,var/**,public/build/**,node_modules/**,docker/**,migrations/**

# Test exclusions
sonar.test.exclusions=tests/**

# Coverage report path (generated by PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml

# PHPUnit test report
sonar.php.tests.reportPath=phpunit-report.xml

