networks:
  irish-network:
    driver: bridge

services:
  php:
    container_name: php_irish
    environment:
      - PHP_IDE_CONFIG=serverName=XdebugServer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./docker/php
    ports:
      - '9003:9003'
      - '9000:9000'
      - '2525:2525'
    volumes:
      - ./:/var/www/irish
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      # xdebug
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    depends_on:
      - mysql
      - elasticsearch
    networks:
      - irish-network

  mysql:
    image: mysql:8
    container_name: mysql_irish
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    command: --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
    networks:
      - irish-network

  nginx:
    container_name: nginx_irish
    build:
      context: ./docker/nginx
    volumes:
      - ./:/var/www/irish
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
    networks:
      - irish-network

  mailhog:
    container_name: mailhog_irish
    image: mailhog/mailhog
    restart: always
    logging:
      driver: "none"
    ports:
      - "8025:8025" # UI
      - "1025:1025"
    networks:
      - irish-network

  redis:
    container_name: redis_irish
    image: redis:latest
    ports:
      - "6379:6379"
    environment:
      TZ: ${DEFAULT_TIMEZONE}
    networks:
      - irish-network

  elasticsearch:
    container_name: elasticsearch_irish
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=irish-cluster
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - irish-network

  logstash:
    container_name: logstash_irish
    image: docker.elastic.co/logstash/logstash:8.12.0
    volumes:
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./var/log:/var/log/symfony:ro
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - irish-network

  kibana:
    container_name: kibana_irish
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - irish-network
