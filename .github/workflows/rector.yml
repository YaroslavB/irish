name: Rector

on:
  pull_request:
    branches: [main]

jobs:
  rector:
    name: Rector Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Rector reads the compiled dev container XML (see rector.php) for Symfony
      # service type inference, so it must exist before the dry-run.
      - name: Warm up Symfony cache
        run: php bin/console cache:warmup --env=dev

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

